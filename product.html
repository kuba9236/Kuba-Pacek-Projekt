<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Szczegóły produktu | BrickStore</title><link rel="stylesheet" href="style.css?v=3-naprawa"></head>
<body><header><a class="logo logo-link" href="index.html">BRICK<span>STORE</span></a><nav><a href="index.html#produkty">Produkty</a><a href="index.html#ulubione">Ulubione</a></nav><div class="header-icons"><a class="header-cart-link" href="index.html#produkty">🛒 Koszyk <span id="cartCount">0</span></a></div></header>
<main class="detail-main"><p class="breadcrumb"><a href="index.html#produkty">← Wróć do produktów</a></p><p id="detailStatus" class="status" role="status">Ładowanie szczegółów…</p><article id="productDetail" class="detail-layout hidden"><div class="detail-image-wrap"><img id="detailImage" alt="Zdjęcie produktu"></div><div class="detail-content"><p id="detailCategory" class="detail-category"></p><h1 id="detailName"></h1><p id="detailPrice" class="detail-price"></p><p id="detailStock" class="detail-stock"></p><h2>Opis zestawu</h2><p id="detailDescription" class="detail-description"></p><div class="detail-actions"><label for="detailQuantity">Ilość</label><input id="detailQuantity" type="number" min="1" value="1" step="1"><button id="detailAdd" class="detail-add">🛒 Dodaj do koszyka</button><button id="detailFavorite" class="detail-favorite">♡ Dodaj do ulubionych</button></div><p id="detailMessage" role="status" class="status"></p><button id="shareProduct" class="detail-share" type="button">🔗 Kopiuj link do produktu</button><div class="stock-track"><div id="stockBar"></div></div><p id="stockHint" class="stock-hint"></p><p class="detail-note">Produkty i ceny pobierane są z bazy danych skleplego. Koszyk zapisuje się w tej przeglądarce.</p></div></article><section class="detail-extra"><h2>Podobne zestawy LEGO</h2><div id="relatedProducts" class="products-container"></div><h2 class="recent-title">Ostatnio oglądane</h2><div id="recentProducts" class="products-container"></div></section></main><script src="product.js?v=3-naprawa"></script></body></html>
